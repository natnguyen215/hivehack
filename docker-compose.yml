services:
  frontend:
    build: ./frontend
    container_name: ember-frontend
    environment:
      - NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - ember-net

  backend:
    build: ./backend
    container_name: ember-backend
    environment:
      # Must be set in .env at repo root — no default, required
      - DATABASE_URL=${DATABASE_URL}
      # Must be set in .env at repo root — no default, required
      - REDIS_URL=${REDIS_URL}
      - ROUTING_PROVIDER=${ROUTING_PROVIDER:-osm}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      # Must be set in .env at repo root — used to HMAC-sign cache keys
      - SECRET_KEY=${SECRET_KEY}
      - ALLOW_MOCK_FALLBACK=${ALLOW_MOCK_FALLBACK:-true}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - ember-net

  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: ember-postgres
    environment:
      - POSTGRES_USER=ember
      - POSTGRES_PASSWORD=ember
      - POSTGRES_DB=emberpath
    ports:
      - "5432:5432"
    networks:
      - ember-net

  redis:
    image: redis:7-alpine
    container_name: ember-redis
    ports:
      - "6379:6379"
    networks:
      - ember-net

networks:
  ember-net:
    driver: bridge

volumes:
  node_modules:
